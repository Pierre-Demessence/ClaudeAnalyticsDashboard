name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Nothing is published unless the tag matches the versions and everything passes.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/release-check.ts "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: npm run image:check

  widget:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked --manifest-path widget/Cargo.toml
      - run: cargo build --release --locked --manifest-path widget/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: cca-widget
          path: widget/target/release/cca-widget.exe
          if-no-files-found: error

  # Trusted publishing: the package's publisher is set on npmjs.com to this repository and
  # workflow, so no token is stored. It only stages the version (the publisher does not allow
  # a direct `npm publish`): it goes live when a maintainer approves it with 2FA on npmjs.com
  # (Staged Packages tab). Needs npm >= 11.15.0; provenance is automatic.
  publish:
    needs: [verify, widget]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.15.0
      - run: npm ci
      - run: npm stage publish

  # After the npm stage, so a failed verify, widget or publish pushes no image. The image goes
  # live at once, unlike the npm version. The build stage runs on the runner's own platform
  # (`--platform=$BUILDPLATFORM` in the Dockerfile) and the final stage has no `RUN`, so arm64
  # needs no emulation. `latest` and `X.Y` come with every release except a prerelease.
  # The third-party actions are pinned to a commit: they hold a token that can push the image
  # users pull, and a moved tag would run new code with it.
  image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/claude-analytics-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  # The exe is unsigned: Windows SmartScreen asks once before running it.
  release:
    needs: [publish, widget, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: >-
          gh release create "$GITHUB_REF_NAME"
          cca-widget/cca-widget.exe
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
